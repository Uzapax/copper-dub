<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamDJ — Заказ треков на стриме</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0e0e10;
      color: #efeff1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #18181b;
      border: 1px solid #2d2d35;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #9146ff, #ff8522, #00e676);
    }
    .dj-icon {
      font-size: 56px;
      margin-bottom: 14px;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 18px;
    }
    .badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .badge.connecting {
      background: rgba(145, 70, 255, 0.15);
      color: #bf94ff;
      border: 1px solid rgba(145, 70, 255, 0.3);
    }
    .badge.online {
      background: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.3);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .dot.pulse {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }
    .desc {
      font-size: 14px;
      color: #adadb8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(145, 70, 255, 0.2);
      border-top-color: #9146ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      margin-top: 10px;
    }
    .btn-twitch {
      background: #9146ff;
      color: #fff;
    }
    .btn-twitch:hover {
      background: #772ce8;
    }
    .btn-retry {
      background: #26262c;
      color: #efeff1;
    }
    .btn-retry:hover {
      background: #323239;
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #71717a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="dj-icon">🎧</div>
    <h1>StreamDJ</h1>
    
    <div id="badge" class="badge connecting">
      <span class="dot pulse"></span>
      <span id="badge-text">Проверка стрима...</span>
    </div>

    <div id="loading-spinner" class="spinner"></div>

    <p id="desc" class="desc">
      Подключаемся к активной очереди заказов...
    </p>

    <div id="actions" style="display: none;">
      <a href="https://twitch.tv/uzapax" target="_blank" class="btn btn-twitch">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
        </svg>
        Смотреть стрим на Twitch
      </a>
      <button onclick="checkStatus()" class="btn btn-retry">
        🔄 Проверить снова
      </button>
    </div>

    <div class="footer">
      Автоматическое перенаправление при запуске стрима
    </div>
  </div>

  <script>
    async function checkStatus() {
      const badge = document.getElementById('badge');
      const badgeText = document.getElementById('badge-text');
      const desc = document.getElementById('desc');
      const spinner = document.getElementById('loading-spinner');
      const actions = document.getElementById('actions');

      let data = null;

      // 1. Try instant GitHub API
      try {
        const res = await fetch('https://api.github.com/repos/Uzapax/copper-dub/contents/stream_dj_status.json', {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.ok) {
          const json = await res.json();
          const decoded = decodeURIComponent(escape(atob(json.content)));
          data = JSON.parse(decoded);
        }
      } catch (e) {}

      // 2. Fallback to raw GitHub
      if (!data) {
        try {
          const res = await fetch('https://raw.githubusercontent.com/Uzapax/copper-dub/main/stream_dj_status.json?v=' + Date.now());
          if (res.ok) {
            data = await res.json();
          }
        } catch (e) {}
      }

      // 3. Evaluate state
      if (data && data.online && data.url) {
        badge.className = 'badge online';
        badgeText.innerText = 'Стрим онлайн! Перенаправление...';
        desc.innerText = 'Открываем стол заказов треков...';
        spinner.style.display = 'block';
        actions.style.display = 'none';

        const channel = data.channel || 'Uzapax_Dub';
        const targetUrl = data.url.replace(/\/+$/, '') + '/c/' + channel;
        setTimeout(() => {
          window.location.replace(targetUrl);
        }, 200);
        return;
      }

      showOffline();
    }

    function showOffline() {
      const badge = document.getElementById('badge');
      const badgeText = document.getElementById('badge-text');
      const desc = document.getElementById('desc');
      const spinner = document.getElementById('loading-spinner');
      const actions = document.getElementById('actions');

      badge.className = 'badge offline';
      badgeText.innerText = 'Стрим оффлайн';
      desc.innerText = 'Стрим сейчас не в эфире. Стол заказов откроется автоматически, как только стример запустит трансляцию!';
      spinner.style.display = 'none';
      actions.style.display = 'block';
    }

    // Initial check
    checkStatus();

    // Auto poll every 6 seconds while offline
    setInterval(checkStatus, 6000);
  </script>
</body>
</html>
